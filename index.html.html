<!doctype html>
<html lang="en">

    <meta

      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #fbf7f2;
        --card: #fff;
        --ink: #1c1917;
        --mute: #655d56;
        --gold: #8f6a2e;
        --gold2: #c9a35f;
        --nude: #f0e2d6;
        --line: #e8dccf;
        --btn: #1c1917;
        --btnt: #fbf7f2;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #14110f;
          --card: #1e1a17;
          --ink: #f6efe7;
          --mute: #b8ada2;
          --gold: #d8b26d;
          --gold2: #c9a35f;
          --nude: #2a2320;
          --line: #3a312b;
          --btn: #f6efe7;
          --btnt: #14110f;
        }
      }
      :root[data-theme="dark"] {
        --bg: #14110f;
        --card: #1e1a17;
        --ink: #f6efe7;
        --mute: #b8ada2;
        --gold: #d8b26d;
        --gold2: #c9a35f;
        --nude: #2a2320;
        --line: #3a312b;
        --btn: #f6efe7;
        --btnt: #14110f;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          16px/1.6 Jost,
          system-ui,
          sans-serif;
      }
      h1,
      h2,
      h3 {
        font-family: "Cormorant Garamond", Georgia, serif;
        font-weight: 600;
        line-height: 1.1;
        margin: 0;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      img {
        max-width: 100%;
      }
      :focus-visible {
        outline: 3px solid var(--gold2);
        outline-offset: 2px;
      }
      .wrap {
        max-width: 1180px;
        margin: 0 auto;
        padding: 0 20px;
      }
      section {
        padding: 64px 0;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 14px 26px;
        border-radius: 999px;
        border: 1.5px solid var(--btn);
        background: var(--btn);
        color: var(--btnt);
        font:
          600 15px Jost,
          sans-serif;
        letter-spacing: 0.06em;
        cursor: pointer;
        transition:
          transform 0.2s,
          box-shadow 0.2s,
          background 0.2s;
      }
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
      }
      .btn.ghost {
        background: transparent;
        color: var(--ink);
      }
      .btn.gold {
        background: var(--gold2);
        border-color: var(--gold2);
        color: #1c1917;
      }
      .btn.wa {
        background: #1a7f4b;
        border-color: #1a7f4b;
        color: #fff;
      }
      .btn.sm {
        padding: 10px 18px;
        font-size: 13px;
      }
      .btn.block {
        width: 100%;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 20;
        background: color-mix(in srgb, var(--bg) 92%, transparent);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
        padding-top: env(safe-area-inset-top, 0px);
      }
      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 68px;
      }
      .logo {
        font:
          600 25px "Cormorant Garamond",
          serif;
        letter-spacing: 0.14em;
      }
      .logo b {
        color: var(--gold);
      }
      nav ul {
        display: flex;
        gap: 30px;
        list-style: none;
        margin: 0;
        padding: 0;
        align-items: center;
      }
      nav a.l {
        font-weight: 500;
        padding: 6px 0;
        border-bottom: 2px solid transparent;
      }
      nav a.l:hover,
      nav a.l.on {
        border-color: var(--gold2);
      }
      .burger {
        display: none;
        background: none;
        border: 0;
        font-size: 28px;
        color: var(--ink);
        cursor: pointer;
      }
      @media (max-width: 820px) {
        .burger {
          display: block;
        }
        nav {
          position: absolute;
          left: 0;
          right: 0;
          top: 100%;
          background: var(--bg);
          border-bottom: 1px solid var(--line);
          display: none;
          padding: 12px 20px 20px;
        }
        nav.open {
          display: block;
        }
        nav ul {
          flex-direction: column;
          align-items: stretch;
          gap: 6px;
        }
        nav a.l {
          display: block;
          padding: 12px 0;
        }
      }
      .hero {
        padding: 40px 0 56px;
      }
      .hero .wrap {
        display: grid;
        grid-template-columns: 1.05fr 0.95fr;
        gap: 40px;
        align-items: center;
      }
      .hero h1 {
        font-size: clamp(40px, 6vw, 74px);
      }
      .hero p {
        color: var(--mute);
        font-size: 18px;
        max-width: 52ch;
        margin: 20px 0 28px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      .trust {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 22px;
        margin-top: 26px;
        color: var(--mute);
        font-size: 14px;
      }
      .trust span:before {
        content: "✓ ";
        color: var(--gold);
      }
      .art {
        aspect-ratio: 4/5;
        border-radius: 200px 200px 24px 24px;
        background: linear-gradient(160deg, #f3e3d3, #d9b98f 55%, #8f6a2e);
        position: relative;
        overflow: hidden;
        box-shadow: 0 30px 60px -20px rgba(80, 50, 10, 0.4);
      }
      .art .big {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font:
          italic 500 clamp(90px, 16vw, 190px)/1 "Cormorant Garamond",
          serif;
        color: rgba(255, 255, 255, 0.55);
      }
      .art .tag {
        position: absolute;
        left: 18px;
        right: 18px;
        bottom: 18px;
        background: rgba(255, 255, 255, 0.9);
        color: #1c1917;
        border-radius: 16px;
        padding: 14px 16px;
        font-size: 14px;
      }
      .art .tag b {
        display: block;
        font:
          600 20px "Cormorant Garamond",
          serif;
      }
      @media (max-width: 820px) {
        .hero .wrap {
          grid-template-columns: 1fr;
        }
        .art {
          max-width: 380px;
          margin: 0 auto;
          width: 100%;
        }
      }
      .head {
        text-align: center;
        max-width: 680px;
        margin: 0 auto 38px;
      }
      .head h2 {
        font-size: clamp(30px, 4.5vw, 46px);
      }
      .head p {
        color: var(--mute);
        margin: 12px 0 0;
      }
      .welcome {
        background: var(--nude);
      }
      .grid {
        display: grid;
        gap: 22px;
      }
      .cats {
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      }
      .prods {
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      }
      .cat {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 22px;
        overflow: hidden;
        text-align: center;
        transition:
          transform 0.25s,
          box-shadow 0.25s;
        cursor: pointer;
        padding: 0 0 18px;
      }
      .cat:hover,
      .card:hover {
        transform: translateY(-4px);
        box-shadow: 0 18px 34px -16px rgba(60, 40, 10, 0.35);
      }
      .cat h3 {
        font-size: 24px;
        margin: 14px 0 10px;
      }
      .ph {
        aspect-ratio: 1/1;
        display: grid;
        place-items: center;
        background: linear-gradient(150deg, var(--a), var(--b));
        color: rgba(255, 255, 255, 0.92);
        position: relative;
      }
      .ph svg {
        width: 38%;
        height: 38%;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .ph img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 22px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition:
          transform 0.25s,
          box-shadow 0.25s;
      }
      .card .body {
        padding: 16px 18px 20px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1;
      }
      .card h3 {
        font-size: 23px;
      }
      .card .d {
        color: var(--mute);
        font-size: 14px;
        flex: 1;
      }
      .card .c {
        font-size: 12px;
        color: var(--gold);
        font-weight: 600;
        letter-spacing: 0.08em;
      }
      .price {
        font-weight: 600;
      }
      .price.ph2 {
        color: var(--mute);
        font-weight: 500;
      }
      .card .row {
        margin-top: 10px;
      }
      .card .row .btn {
        flex: 1;
      }
      .why {
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }
      .why div {
        padding: 26px;
        border-radius: 20px;
        border: 1px solid var(--line);
        background: var(--card);
      }
      .why h3 {
        font-size: 22px;
        margin: 8px 0;
      }
      .why p {
        margin: 0;
        color: var(--mute);
        font-size: 15px;
      }
      .why i {
        font-style: normal;
        font-size: 26px;
        color: var(--gold);
      }
      .cta {
        background: #1c1917;
        color: #fbf7f2;
        text-align: center;
        border-radius: 28px;
        padding: 64px 24px;
      }
      .cta h2 {
        font-size: clamp(30px, 5vw, 54px);
        color: var(--gold2);
      }
      .cta p {
        opacity: 0.85;
        margin: 14px 0 26px;
      }
      .filters {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        padding: 4px 2px 14px;
        margin-bottom: 14px;
        scrollbar-width: thin;
      }
      .chip {
        flex: none;
        padding: 10px 20px;
        border-radius: 999px;
        border: 1.5px solid var(--line);
        background: var(--card);
        color: var(--ink);
        font:
          500 14px Jost,
          sans-serif;
        cursor: pointer;
      }
      .chip.on {
        background: var(--btn);
        color: var(--btnt);
        border-color: var(--btn);
      }
      .pg {
        padding: 40px 0 20px;
      }
      .pg h1 {
        font-size: clamp(36px, 6vw, 58px);
      }
      .pg p.lead {
        color: var(--mute);
        max-width: 60ch;
        margin: 12px 0 26px;
      }
      .form {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 28px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .form .f {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .form .full {
        grid-column: 1/-1;
      }
      .form label {
        font-size: 14px;
        font-weight: 500;
      }
      input,
      select,
      textarea {
        font:
          16px Jost,
          sans-serif;
        padding: 13px 14px;
        border-radius: 12px;
        border: 1.5px solid var(--line);
        background: var(--bg);
        color: var(--ink);
        width: 100%;
      }
      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--gold2);
        outline: none;
      }
      @media (max-width: 640px) {
        .form {
          grid-template-columns: 1fr;
          padding: 20px;
        }
      }
      .layout {
        display: grid;
        grid-template-columns: 1.6fr 1fr;
        gap: 26px;
        align-items: start;
      }
      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }
      .side {
        background: var(--nude);
        border-radius: 24px;
        padding: 26px;
        display: grid;
        gap: 14px;
      }
      .side h3 {
        font-size: 26px;
      }
      .side p {
        margin: 0;
        color: var(--mute);
        font-size: 15px;
      }
      .ok {
        background: var(--card);
        border: 1.5px solid var(--gold2);
        border-radius: 24px;
        padding: 34px;
        text-align: center;
      }
      .ok h2 {
        font-size: 34px;
        margin-bottom: 10px;
      }
      .ok p {
        color: var(--mute);
        max-width: 52ch;
        margin: 0 auto 20px;
      }
      .cc {
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        margin-bottom: 26px;
      }
      .cc div {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 26px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: flex-start;
      }
      .cc h3 {
        font-size: 26px;
      }
      .cc p {
        margin: 0;
        color: var(--mute);
      }
      footer {
        background: #1c1917;
        color: #e9dfd3;
        margin-top: 64px;
        padding: 48px 0 28px;
      }
      footer .g {
        display: grid;
        grid-template-columns: 1.4fr 1fr 1fr;
        gap: 30px;
      }
      @media (max-width: 700px) {
        footer .g {
          grid-template-columns: 1fr;
        }
      }
      footer h4 {
        margin: 0 0 10px;
        font: 600 14px Jost;
        letter-spacing: 0.12em;
        color: var(--gold2);
      }
      footer a {
        display: block;
        padding: 3px 0;
        opacity: 0.9;
      }
      footer a:hover {
        color: var(--gold2);
      }
      footer .logo {
        color: #fbf7f2;
      }
      .soc {
        display: flex;
        gap: 10px;
        margin-top: 12px;
      }
      .soc a,
      .soc span {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 1px solid #5a4d42;
        display: grid;
        place-items: center;
        font-size: 13px;
        font-weight: 600;
        padding: 0;
      }
      .copy {
        border-top: 1px solid #3a312b;
        margin-top: 30px;
        padding-top: 18px;
        font-size: 14px;
        opacity: 0.75;
      }
      .fab {
        position: fixed;
        right: 16px;
        bottom: calc(16px + env(safe-area-inset-bottom, 0px));
        z-index: 30;
        display: flex;
        align-items: center;
        gap: 8px;
        background: #1a7f4b;
        color: #fff;
        padding: 13px 20px;
        border-radius: 999px;
        font-weight: 600;
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.3);
      }
      .view {
        animation: in 0.35s ease;
      }
      @keyframes in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>

        Shoes: ["#d8c3a5", "#8f6a2e"],
        Bags: ["#c9a486", "#6e4b34"],
        Jewelry: ["#ecd9a8", "#b8893a"],
        Perfumes: ["#e9cfd0", "#b07b83"],
        Watches: ["#cfc6bb", "#5c5147"],
        Accessories: ["#dcc6a8", "#9c7442"],
      };
      const wa = (t) => `https://wa.me/${WA}?text=${encodeURIComponent(t)}`;
      const $ = (s) => document.querySelector(s);
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const ph = (cat, img, alt) => {
        const h = HUE[cat] || HUE.Accessories;
        return `<div class="ph" style="--a:${h[0]};--b:${h[1]}">${ICON[cat] || ""}${img ? `<img src="${esc(img)}" alt="${esc(alt)}" loading="lazy">` : ""}</div>`;
      };
      const card = (p) =>
        `<article class="card">${ph(p.cat, p.img, p.name)}<div class="body"><span class="c">${esc(p.cat.toUpperCase())}</span><h3>${esc(p.name)}</h3><div class="d">${esc(p.desc)}</div><div class="price ${p.price ? "" : "ph2"}">${p.price ? esc(p.price) : "Ask for price"}</div><div class="row"><a class="btn ghost sm" href="${wa("Hello Beauty Empire, I am interested in: " + p.name + ". Please share price and availability.")}" target="_blank" rel="noopener">Ask price</a><a class="btn sm" href="#order?item=${p.id}">Order Now</a></div></div></article>`;
      let filter = "All";

      function home() {
        return `
<section class="hero"><div class="wrap"><div>
<h1>ELEVATE YOUR STYLE WITH BEAUTY EMPIRE</h1>
<p>Discover stylish fashion, beautiful accessories, fragrances, footwear, and timeless pieces carefully selected to elevate your everyday look.</p>
<div class="row"><a class="btn" href="#shop">SHOP NOW</a><a class="btn ghost" href="#order">PLACE AN ORDER</a></div>
<div class="trust"><span>Order in minutes</span><span>Chat with us on WhatsApp</span><span>Delivery details confirmed before you pay</span></div></div>
<div class="art" role="img" aria-label="Beauty Empire featured style"><div class="big">BE</div><div class="tag"><b>New arrivals, chosen for you</b>Clothing, shoes, bags, jewelry, perfumes and watches.</div></div>
</div></section>
<section class="welcome"><div class="wrap head" style="margin-bottom:0"><h2>WELCOME TO BEAUTY EMPIRE</h2><p>Beauty Empire brings fashion, beauty, and elegance together in one place. From stylish clothing and statement accessories to beautiful shoes, bags, perfumes, and watches, we make it easy to find pieces that complement your personal style.</p></div></section>
<section><div class="wrap"><div class="head"><h2>Shop by category</h2><p>Tap a category to see what we have.</p></div>
<div class="grid cats">${["Clothing", "Shoes", "Bags", "Jewelry", "Perfumes", "Watches"].map((c) => `<a class="cat" href="#shop?cat=${c}">${ph(c)}<h3>${c}</h3><span class="btn sm ghost">Shop Now</span></a>`).join("")}</div></div></section>
<section style="padding-top:0"><div class="wrap"><div class="head"><h2>WHY SHOP WITH BEAUTY EMPIRE?</h2></div>
<div class="grid why"><div><i>◆</i><h3>QUALITY PRODUCTS</h3><p>Carefully selected fashion and lifestyle products.</p></div><div><i>◆</i><h3>STYLISH &amp; TRENDY</h3><p>Discover pieces that keep your wardrobe fresh and fashionable.</p></div><div><i>◆</i><h3>CUSTOMER SATISFACTION</h3><p>We value every customer and strive to provide a pleasant shopping experience.</p></div><div><i>◆</i><h3>EASY ORDERING</h3><p>Contact us and place your order quickly and conveniently.</p></div></div></div></section>
<section style="padding-top:0"><div class="wrap"><div class="head"><h2>Featured pieces</h2><p>Pick what you love, tap Order Now, and we will confirm price, availability and delivery with you.</p></div>
<div class="grid prods">${PRODUCTS.slice(0, 8).map(card).join("")}</div>
<p style="text-align:center;margin-top:28px"><a class="btn ghost" href="#shop">See the full collection</a></p></div></section>
<section style="padding-top:0"><div class="wrap"><div class="cta"><h2>YOUR STYLE. YOUR STATEMENT. YOUR EMPIRE.</h2><p>Find something beautiful for yourself or someone special at Beauty Empire.</p><div class="row" style="justify-content:center"><a class="btn gold" href="#shop">SHOP BEAUTY EMPIRE</a><a class="btn wa" href="${wa("Hello Beauty Empire, I would like to place an order. Please assist me.")}" target="_blank" rel="noopener">ORDER VIA WHATSAPP</a></div></div></div></section>`;
      }

      function shop() {
        const list = PRODUCTS.filter(
          (p) => filter === "All" || p.cat === filter,
        );
        return `
<div class="wrap pg"><h1>SHOP BEAUTY EMPIRE</h1><p class="lead">Explore our collection of fashion, accessories, fragrances, footwear, and lifestyle essentials.</p>
<div class="filters" role="group" aria-label="Filter by category">${["All", ...CATS].map((c) => `<button class="chip ${c === filter ? "on" : ""}" data-f="${c}" aria-pressed="${c === filter}">${c === "Watches" ? "Watches" : c}</button>`).join("")}</div>
<div class="grid prods">${list.length ? list.map((p) => card(p).replace(">Ask price<", ">View Details<")).join("") : "<p>No items in this category yet. Message us on WhatsApp and we will help you find it.</p>"}</div></div>`;
      }

      function order(q) {
        const sel = PRODUCTS.find((p) => p.id === q.get("item"));
        return `
<div class="wrap pg"><h1>PLACE YOUR ORDER</h1><p class="lead">Fill in your details below and tell us what you'd like to order. Our team will contact you to confirm availability, price, delivery details, and payment information.</p>
<div class="layout"><div id="box"><form class="form" id="of">
<div class="f"><label for="n">Full Name *</label><input id="n" name="Full Name" required autocomplete="name"></div>
<div class="f"><label for="ph">Phone Number *</label><input id="ph" name="Phone" type="tel" required autocomplete="tel"></div>
<div class="f"><label for="w">WhatsApp Number</label><input id="w" name="WhatsApp" type="tel" placeholder="Same as phone? Leave blank"></div>
<div class="f"><label for="e">Email Address</label><input id="e" name="Email" type="email" autocomplete="email"></div>
<div class="f full"><label for="it">Product / Item *</label><input id="it" name="Item" required list="pl" value="${esc(sel ? sel.name : "")}" placeholder="Type or choose an item"><datalist id="pl">${PRODUCTS.map((p) => `<option value="${esc(p.name)}">`).join("")}</datalist></div>
<div class="f"><label for="qt">Quantity</label><input id="qt" name="Quantity" type="number" min="1" value="1"></div>
<div class="f"><label for="sz">Size (if applicable)</label><input id="sz" name="Size" placeholder="e.g. M, UK 8, 40"></div>
<div class="f"><label for="cl">Color (if applicable)</label><input id="cl" name="Color"></div>
<div class="f"><label for="ad">Delivery Address / City *</label><input id="ad" name="Delivery Address" required autocomplete="street-address"></div>
<div class="f full"><label for="nt">Additional Notes</label><textarea id="nt" name="Notes" rows="3"></textarea></div>
<div class="full"><button class="btn gold block" type="submit" style="padding:18px">SUBMIT ORDER</button></div></form></div>
<aside class="side"><h3>Prefer to chat?</h3><p>Order in seconds and get a quick reply, price and photos straight on WhatsApp.</p>
<a class="btn wa block" href="${wa("Hello Beauty Empire, I would like to place an order. Please assist me.")}" target="_blank" rel="noopener">ORDER VIA WHATSAPP</a>
<p>How it works: send your request, we confirm availability, price and delivery, then you pay and we deliver.</p></aside></div></div>`;
      }

      function contact() {
        return `
<div class="wrap pg"><h1>GET IN TOUCH</h1><p class="lead">Have a question about our products, prices, availability, or delivery? We'd love to hear from you. Contact Beauty Empire and we'll be happy to assist you.</p>
<div class="grid cc"><div><h3>WhatsApp</h3><p>Chat with us directly on WhatsApp</p><a class="btn wa" href="${wa("Hello Beauty Empire, I would like to make an enquiry.")}" target="_blank" rel="noopener">CHAT ON WHATSAPP</a></div>
<div><h3>Phone</h3><p><a href="tel:+2347085471652" style="font-size:22px;font-weight:600">07085471652</a></p></div>
<div><h3>Customer Support</h3><p>We're here to help you find the perfect fashion and beauty products.</p></div></div>
<div id="cbox"><form class="form" id="cf">
<div class="f"><label for="cn">Name *</label><input id="cn" name="Name" required></div><div class="f"><label for="ce">Email</label><input id="ce" name="Email" type="email"></div>
<div class="f full"><label for="cp">Phone</label><input id="cp" name="Phone" type="tel"></div>
<div class="f full"><label for="cm">Message *</label><textarea id="cm" name="Message" rows="4" required></textarea></div>
<div class="full"><button class="btn block" type="submit">Send Message</button></div></form></div></div>`;
      }

      function lines(f) {
        return [...new FormData(f)]
          .filter(([, v]) => String(v).trim())
          .map(([k, v]) => `${k}: ${v}`)
          .join("\n");
      }
      function done(box, title, text, msg, label) {
        box.innerHTML = `<div class="ok"><h2>${title}</h2><p>${text}</p><a class="btn wa" href="${wa(msg)}" target="_blank" rel="noopener">${label}</a></div>`;
        box.scrollIntoView({ behavior: "smooth", block: "center" });
      }

      function route() {
        const [r0, qs] = (location.hash.slice(1) || "home").split("?");
        const q = new URLSearchParams(qs || "");
        const r = ["home", "shop", "order", "contact"].includes(r0)
          ? r0
          : "home";
        if (r === "shop" && q.get("cat"))
          filter = CATS.includes(q.get("cat")) ? q.get("cat") : "All";
        if (r === "shop" && !q.get("cat") && !window._keep) filter = "All";
        $("#app").innerHTML = { home, shop, order: () => order(q), contact }[
          r
        ]();
        document
          .querySelectorAll("nav a.l")
          .forEach((a) => a.classList.toggle("on", a.dataset.r === r));
        $("#nv").classList.remove("open");
        $("#bg").setAttribute("aria-expanded", "false");
        document.title =
          r === "home"
            ? "Beauty Empire | Fashion, Beauty & Elegance"
            : r[0].toUpperCase() + r.slice(1) + " | Beauty Empire";
        if (!window._keep) scrollTo(0, 0);
        window._keep = false;
        const of = $("#of");
        if (of)
          of.onsubmit = (e) => {
            e.preventDefault();
            const t = lines(of);
            done(
              $("#box"),
              "Thank you for choosing Beauty Empire!",
              "Your order request has been received. We will contact you shortly to confirm your order. To get a faster reply, send these details to us on WhatsApp now.",
              "Hello Beauty Empire, I would like to place an order:\n" + t,
              "SEND ORDER ON WHATSAPP",
            );
          };
        const cf = $("#cf");
        if (cf)
          cf.onsubmit = (e) => {
            e.preventDefault();
            const t = lines(cf);
            done(
              $("#cbox"),
              "Message ready",
              "Thanks for reaching out. Tap below to send your message to us on WhatsApp for the quickest reply.",
              "Hello Beauty Empire, I would like to make an enquiry.\n" + t,
              "SEND ON WHATSAPP",
            );
          };
      }
      document.addEventListener("click", (e) => {
        const c = e.target.closest(".chip");
        if (c) {
          filter = c.dataset.f;
          window._keep = true;
          history.replaceState(null, "", "#shop");
          route();
        }
      });
      $("#bg").onclick = () => {
        const o = $("#nv").classList.toggle("open");
        $("#bg").setAttribute("aria-expanded", o);
      };
      $("#fab").href = wa(
        "Hello Beauty Empire, I would like to make an enquiry.",
      );
      addEventListener("hashchange", route);
      route();
    </script>
  </body>
</html>
